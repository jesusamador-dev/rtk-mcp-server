[package]
name = "rtk-mcp-server"
version = "1.6.0"
edition = "2021"
description = "A Model Context Protocol server integrated with Rust Token Killer (RTK)"
authors = ["Kuosel System"]

# El comando/binario para el usuario es `rtk-index` (corto). El crate sigue
# llamándose rtk-mcp-server.
[[bin]]
name = "rtk-index"
path = "src/main.rs"

[dependencies]
ignore = "0.4.31"
globset = "0.4"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5.0"

# Índice de código (Incremento A: léxico + símbolos)
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

# Incremento B: búsqueda de texto completo (BM25) sobre chunks
tantivy = "0.22"

# Incremento C: embeddings locales (ONNX) para búsqueda semántica híbrida
fastembed = "4"
